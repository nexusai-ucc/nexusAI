name: Sync derived repos
#
# El monorepo es la única fuente de verdad para el desarrollo. Los repos
# moodle-local_nexusai y nexusai-backend son artefactos DERIVADOS —
# generados automáticamente vía `git subtree split` cada vez que se
# mergea a `development` — para que el plugin y el backend se puedan
# probar/desplegar de forma independiente (requisito de presentación a
# Moodle Marketplace: el plugin no puede vivir en un monorepo).
#
# Nadie debe commitear directo en la rama `development` de esos dos repos
# derivados: se sobreescribe en el próximo sync. Los cambios van siempre
# acá, en nexusAI/NexusAI/plugin/local/nexusai o NexusAI/services/api.
#
# La rama `main` de cada repo derivado NO se toca acá — queda como
# snapshot manual (p. ej. el que se sube a Moodle Marketplace), a criterio
# de cuándo se decide congelar una versión.
#
# Overlays: cada repo derivado necesita algunos archivos que no viven
# dentro de la carpeta que se separa (típicamente su propio CI, con rutas
# relativas a la raíz de ESE repo). Esos archivos se versionan acá mismo,
# en .github/sync-overlays/<repo>/, y este workflow los reaplica encima
# del resultado del subtree split antes de pushear — así también son
# "un solo lugar para editar", igual que el resto del código.
#
# Seguridad ante pushes manuales (auditoría de Santiago, PR #484): ningún
# repo derivado tiene branch protection en `development` todavía (falta
# activarla a mano, ver comentario de la PR). Como red de contención de
# software mientras tanto, este workflow mantiene una rama espejo
# `sync-bot-state` que actualiza junto con `development` en cada corrida
# exitosa, y antes de cada nuevo `--force` compara las dos: si difieren,
# alguien escribió en `development` sin pasar por acá, y el job falla en
# vez de sobreescribirlo en silencio.
#
# Nota para la primera corrida: `development` de los dos repos derivados
# hoy tiene contenido pusheado a mano (no vía este workflow) que difiere
# bastante del estado actual del monorepo. La primera sincronización lo va
# a reemplazar por completo — cualquiera con un clon local de esos repos
# va a necesitar `git reset --hard origin/development` después.

on:
  push:
    branches: [development]

jobs:
  sync:
    name: Sync ${{ matrix.repo }}
    runs-on: ubuntu-22.04
    concurrency:
      group: sync-derived-repos-${{ matrix.repo }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: moodle-local_nexusai
            prefix: NexusAI/plugin/local/nexusai
          - repo: nexusai-backend
            prefix: NexusAI/services/api

    steps:
      - name: Checkout monorepo (historia completa)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: development

      - name: Configurar identidad git para el commit de overlay
        run: |
          git config user.name "nexusai-sync-bot"
          git config user.email "noreply@github.com"

      - name: git subtree split de ${{ matrix.prefix }}
        run: git subtree split --prefix="${{ matrix.prefix }}" --branch "split-${{ matrix.repo }}"

      - name: Detectar pushes manuales a development desde el último sync
        # Ningún repo derivado tiene branch protection todavía, así que
        # nada impide técnicamente que alguien comitee ahí a mano — y el
        # próximo --force lo perdería sin aviso. `sync-bot-state` es una
        # rama espejo que este mismo workflow actualiza junto con
        # `development` en cada corrida exitosa: si en algún momento
        # difieren, es porque algo más escribió en `development` sin pasar
        # por este workflow. Frena acá en vez de sobreescribirlo en silencio.
        run: |
          REPO="nexusai-ucc/${{ matrix.repo }}"
          DEV_SHA=$(git ls-remote "https://github.com/$REPO.git" refs/heads/development | cut -f1)
          BOT_SHA=$(git ls-remote "https://github.com/$REPO.git" refs/heads/sync-bot-state | cut -f1)
          if [ -n "$BOT_SHA" ] && [ "$DEV_SHA" != "$BOT_SHA" ]; then
            echo "::error::development de $REPO ($DEV_SHA) no coincide con el último estado sincronizado por este workflow ($BOT_SHA) -- alguien pusheó ahí manualmente. Revisar a mano antes de re-sincronizar (ver comentario al inicio del archivo: development es generado, no se edita directo)."
            exit 1
          fi

      - name: Preparar worktree con el resultado del split
        run: git worktree add /tmp/wt-${{ matrix.repo }} "split-${{ matrix.repo }}"

      - name: Reaplicar overlay (archivos propios del repo derivado, p. ej. CI)
        run: |
          OVERLAY=".github/sync-overlays/${{ matrix.repo }}"
          if [ -d "$OVERLAY" ]; then
            cp -a "$OVERLAY"/. "/tmp/wt-${{ matrix.repo }}/"
          fi

      - name: Commitear overlay si cambió algo
        working-directory: /tmp/wt-${{ matrix.repo }}
        run: |
          git config user.name "nexusai-sync-bot"
          git config user.email "noreply@github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): reaplicar overlay tras subtree split automático"
          else
            echo "Sin cambios de overlay para commitear."
          fi

      - name: Push a development de ${{ matrix.repo }}
        working-directory: /tmp/wt-${{ matrix.repo }}
        run: |
          REMOTE="https://x-access-token:${{ secrets.SYNC_REPOS_TOKEN }}@github.com/nexusai-ucc/${{ matrix.repo }}.git"
          git push "$REMOTE" HEAD:development --force
          # Marca "hasta acá sincronizó el bot" -- ver paso de detección de arriba.
          git push "$REMOTE" HEAD:sync-bot-state --force

      - name: Limpiar worktree y rama temporal
        if: always()
        run: |
          git worktree remove "/tmp/wt-${{ matrix.repo }}" --force || true
          git branch -D "split-${{ matrix.repo }}" || true
