name: Publish backend Docker image
#
# Publishes a ready-to-run image of the NexusAI backend to GHCR so anyone
# self-hosting (a reviewer testing the Moodle plugin, or an institution
# deploying for real) can `docker pull` it directly, instead of cloning the
# whole monorepo and building from source. See NexusAI/docker-compose.selfhost.yml
# and NexusAI/docs/REVIEWER_TESTING.md.
#
# The published image is otherwise identical to what docker-build (in
# backend-ci.yml) already sanity-checks on every PR — this workflow only
# adds the push-to-registry step, and only runs on main.

on:
  push:
    branches: [main]
    paths:
      - 'NexusAI/services/api/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nexusai-backend

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Skip if the Dockerfile doesn't exist yet
        id: check
        run: |
          if [ ! -f NexusAI/services/api/Dockerfile ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::NexusAI/services/api/Dockerfile does not exist yet. Skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.check.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v5
        with:
          context: NexusAI/services/api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
