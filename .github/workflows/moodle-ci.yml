name: Moodle Plugin CI
#
# PUB-01 (issue #309): este archivo vivía en NexusAI/.github/workflows/,
# no en la raíz real del repo git (que es un nivel arriba de NexusAI/) —
# GitHub Actions solo descubre workflows en la raíz real, así que nunca
# corrió ni una sola vez. Se movió acá y se agregó el prefijo `NexusAI/`
# a todas las rutas que antes asumían que la raíz del checkout YA era la
# carpeta del proyecto.
#
# Issue #474: el "skip si version.php no existe" corría como primer step,
# ANTES de actions/checkout -- nunca había nada checkouteado en ese punto,
# así que siempre evaluaba a "no existe" y el job entero saltaba todos los
# pasos, reportando verde en ~30s sin correr phpcs/phpunit/behat ni una
# sola vez. Se saca el chequeo: el trigger `paths:` de abajo ya restringe
# cuándo corre el workflow, así que es redundante -- y su ausencia es lo
# que hacía que nunca se ejecutara nada de verdad.

on:
  push:
    branches: [main]
    paths:
      - 'NexusAI/plugin/local/nexusai/**'
      - '!NexusAI/plugin/local/nexusai/react/**'
      - '!NexusAI/plugin/local/nexusai/amd/build/**'
      - '.github/workflows/moodle-ci.yml'
  pull_request:
    paths:
      - 'NexusAI/plugin/local/nexusai/**'
      - '!NexusAI/plugin/local/nexusai/react/**'
      - '!NexusAI/plugin/local/nexusai/amd/build/**'
      - '.github/workflows/moodle-ci.yml'

concurrency:
  group: moodle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Moodle ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        # DATA-02 (#522): el mínimo pasa a Moodle 4.5 LTS. Se prueba el
        # mínimo, la versión que usa la UCC (5.0) y la última estable (5.2),
        # cada una con el PHP más bajo que acepta.
        include:
          # Moodle 4.5 LTS (PHP 8.1+)
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'pgsql'
          # Checklist de Moodle Marketplace pide probar contra MySQL además
          # de PostgreSQL como mínimo (PUB-01, investigación de publicación).
          - php: '8.1'
            moodle-branch: 'MOODLE_405_STABLE'
            database: 'mysqli'
          # Moodle 5.0: la versión de la UCC (PHP 8.2+)
          - php: '8.2'
            moodle-branch: 'MOODLE_500_STABLE'
            database: 'pgsql'
          # Moodle 5.2: última estable, con el directorio public/ (PHP 8.3+)
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            database: 'pgsql'

    services:
      # PostgreSQL 16 y MySQL 8.4 son los mínimos de Moodle 5.2 y 5.0; 4.5
      # también los acepta, así que la misma imagen sirve para toda la matriz.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'true'
          MYSQL_DATABASE: 'moodle_test'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, mbstring, xml, intl, zip, gd, soap
          coverage: none
          ini-values: max_input_vars=5000

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install Moodle + dependencias del plugin
        run: moodle-plugin-ci install --plugin ./plugin/NexusAI/plugin/local/nexusai --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      # ----------------------------------------------------------------
      # Validaciones de calidad de código
      # ----------------------------------------------------------------
      - name: PHP Lint
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        run: moodle-plugin-ci phpmd

      - name: PHP CodeSniffer (Moodle Coding Standard)
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: PHPDoc checker
        continue-on-error: true
        run: moodle-plugin-ci phpdoc

      - name: Validating
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        run: moodle-plugin-ci mustache

      - name: Grunt
        continue-on-error: true
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      # ----------------------------------------------------------------
      # Tests
      # ----------------------------------------------------------------
      - name: PHPUnit tests
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        continue-on-error: true   # Behat puede ser flaky en CI; no bloquear merge por esto en MVP
        run: moodle-plugin-ci behat --profile chrome
