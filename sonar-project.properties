# SonarQube Cloud — quality gate de NexusAI (TPC-02, issue #574)
#
# Lo usa el job `sonar` de .github/workflows/quality-gate.yml. Los reportes de
# cobertura los generan los jobs anteriores del mismo workflow y llegan acá
# como artifacts (ver las rutas al final).
#
# Alcance: solo el código del producto — backend, plugin de Moodle y widget
# React. Quedan afuera docs/, entrega-final/, pendrive/, investigacion/ (HTML
# de presentaciones y copias que inflaban la duplicación del primer análisis
# automático) y .github/ (los hallazgos de supply chain de los workflows se
# tratan aparte; ver docs/calidad/HERRAMIENTA_SONARCLOUD.md).

sonar.organization=nexusai-ucc
sonar.projectKey=nexusai-ucc_nexusAI
sonar.projectName=NexusAI
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Código fuente y tests
# ---------------------------------------------------------------------------
sonar.sources=NexusAI/services/api/app,NexusAI/plugin/local/nexusai
sonar.tests=NexusAI/services/api/tests,NexusAI/plugin/local/nexusai

# Un archivo no puede ser fuente y test a la vez: lo que entra por
# test.inclusions tiene que estar en exclusions.
sonar.test.inclusions=\
  NexusAI/services/api/tests/**,\
  NexusAI/plugin/local/nexusai/tests/**,\
  NexusAI/plugin/local/nexusai/react/src/**/*.test.js,\
  NexusAI/plugin/local/nexusai/react/src/**/*.test.jsx,\
  NexusAI/plugin/local/nexusai/react/src/test-utils/**

sonar.exclusions=\
  NexusAI/plugin/local/nexusai/tests/**,\
  NexusAI/plugin/local/nexusai/react/src/**/*.test.js,\
  NexusAI/plugin/local/nexusai/react/src/**/*.test.jsx,\
  NexusAI/plugin/local/nexusai/react/src/test-utils/**,\
  NexusAI/plugin/local/nexusai/react/node_modules/**,\
  NexusAI/plugin/local/nexusai/react/coverage/**,\
  NexusAI/plugin/local/nexusai/react/scripts/**,\
  NexusAI/plugin/local/nexusai/react/*.config.js,\
  NexusAI/plugin/local/nexusai/react/vitest.setup.js,\
  NexusAI/plugin/local/nexusai/amd/build/**,\
  NexusAI/plugin/local/nexusai/pix/**,\
  NexusAI/plugin/local/nexusai/amd/src/chatwidget-lazy.js,\
  NexusAI/plugin/local/nexusai/amd/src/documents-manager-lazy.js,\
  **/vendor/**

# amd/src/*-lazy.js son los bundles que webpack genera desde react/src (están
# en thirdpartylibs.xml): analizarlos duplicaría todo el widget.

# Declarativo, sin lógica que testear: definiciones de web services, tablas,
# capacidades, strings de idioma y metadata del plugin.
sonar.coverage.exclusions=\
  NexusAI/plugin/local/nexusai/db/**,\
  NexusAI/plugin/local/nexusai/lang/**,\
  NexusAI/plugin/local/nexusai/version.php,\
  NexusAI/plugin/local/nexusai/react/src/**/*.css

# db/services.php repite la misma estructura de array por cada web service.
sonar.cpd.exclusions=\
  NexusAI/plugin/local/nexusai/db/**,\
  NexusAI/plugin/local/nexusai/lang/**

# ---------------------------------------------------------------------------
# Reportes (los genera quality-gate.yml)
# ---------------------------------------------------------------------------
sonar.python.version=3.11
# pytest --cov=app --cov-branch --cov-report=xml
sonar.python.coverage.reportPaths=NexusAI/services/api/coverage.xml
# vitest --coverage (v8), SF: reescrito a rutas desde la raíz del repo
sonar.javascript.lcov.reportPaths=NexusAI/plugin/local/nexusai/react/coverage/lcov.info
# moodle-plugin-ci phpunit --coverage-pcov --coverage-clover, rutas reescritas
sonar.php.coverage.reportPaths=coverage-reports/plugin-clover.xml

# Reglas de estilo que contradicen el estándar de Moodle (TPC-10, #582).
# php:S6600 pide `require_once x;` sin paréntesis, y el phpcs de Moodle
# (moodle.PHP.IncludingFile.BracketsRequired) los exige y hace fallar el CI
# del plugin. Para un plugin de Moodle manda el estándar de la plataforma.
sonar.issue.ignore.multicriteria=moodle1
sonar.issue.ignore.multicriteria.moodle1.ruleKey=php:S6600
sonar.issue.ignore.multicriteria.moodle1.resourceKey=NexusAI/plugin/**/*.php
