name: Frontend CI
#
# Hallazgo de SEC-01 (issue #317): este workflow apuntaba a
# `plugin/local/nexusai/package.json`, pero el package.json real vive en
# `plugin/local/nexusai/react/`. El check de "skip si no existe" siempre
# daba true, así que este job nunca corrió de verdad — solo hacía skip en
# silencio en cada push/PR. Se corrigieron los paths.
#
# De paso se sacaron los steps de "ESLint"/"Jest": no hay config de ESLint
# ni de Jest en el proyecto (ni las deps instaladas) — el workflow los
# referenciaba pero nunca existieron. Corregir el path bug los hubiera
# hecho fallar de verdad por primera vez (`Missing script: "lint"`).
# Configurar lint/tests del frontend es trabajo aparte, no de esta issue.

on:
  push:
    branches: [main]
    paths:
      - 'plugin/local/nexusai/react/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'plugin/local/nexusai/react/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Dependency scan + Build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Skip si no hay package.json todavía
        id: check
        run: |
          if [ ! -f plugin/local/nexusai/react/package.json ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::plugin/local/nexusai/react/package.json no existe todavía. Saltando frontend CI."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node 20
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugin/local/nexusai/react/package-lock.json

      - name: Install deps
        if: steps.check.outputs.skip == 'false'
        working-directory: plugin/local/nexusai/react
        run: npm ci

      - name: npm audit (SEC-01 / issue #317) — falla en severidad alta o crítica
        if: steps.check.outputs.skip == 'false'
        working-directory: plugin/local/nexusai/react
        run: npm audit --audit-level=high

      - name: Webpack build (production)
        if: steps.check.outputs.skip == 'false'
        working-directory: plugin/local/nexusai/react
        run: npm run build

      - name: Verificar tamaño del bundle (warn si > 512 KB)
        if: steps.check.outputs.skip == 'false'
        working-directory: plugin/local/nexusai
        run: |
          BUNDLE=amd/build/chatwidget-lazy.min.js
          if [ ! -f "$BUNDLE" ]; then
            echo "::error::No se generó $BUNDLE"
            exit 1
          fi
          SIZE=$(wc -c < "$BUNDLE")
          SIZE_KB=$((SIZE / 1024))
          echo "Bundle size: $SIZE_KB KB"
          if [ $SIZE_KB -gt 512 ]; then
            echo "::warning::Bundle size ($SIZE_KB KB) supera el target de 512 KB"
          fi

      - name: Verificar que el bundle commiteado coincide con el generado
        if: steps.check.outputs.skip == 'false' && github.event_name == 'pull_request'
        working-directory: plugin/local/nexusai
        run: |
          # Si el bundle generado difiere del commiteado, fallar
          # (forzamos a que el dev regenere y commitee antes de pedir review)
          if ! git diff --exit-code amd/build/chatwidget-lazy.min.js; then
            echo "::error::El bundle commiteado no coincide con el generado por 'npm run build'."
            echo "::error::Corré 'npm run build' localmente y commiteá el resultado."
            exit 1
          fi
