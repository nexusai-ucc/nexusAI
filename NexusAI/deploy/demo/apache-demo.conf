# Ajustes de Apache para la demo con público.
#
# Cada chat en streaming ocupa un proceso de Apache mientras dura la respuesta
# (local/nexusai/chat_stream.php). Con 60 personas preguntando a la vez, más
# las páginas normales, el default se queda corto. Valores para un servidor
# de 4 vCPU y 8 GB; se ajustan con la prueba de carga.
<IfModule mpm_prefork_module>
    StartServers            10
    MinSpareServers         10
    MaxSpareServers         30
    ServerLimit             200
    MaxRequestWorkers       200
    MaxConnectionsPerChild  1000
</IfModule>

# Las respuestas del LLM pueden tardar: margen para el stream.
Timeout 300
